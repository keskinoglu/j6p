repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets in git history
        entry: gitleaks git --redact --verbose --log-opts=--all
        always_run: true
        stages: [manual]

  - repo: local
    hooks:
      - id: check-sensitive-data
        name: check for IBANs, US bank numbers, and personal terms
        entry: python hooks/check_sensitive_data.py
        language: python
        types: [text]
        exclude: ^uv\.lock$
      - id: check-sensitive-data-history
        name: check git history for IBANs, US bank numbers, and personal terms
        entry: python hooks/check_sensitive_data.py --history
        args: [":(exclude)uv.lock"]
        language: python
        pass_filenames: false
        always_run: true
        stages: [manual]
